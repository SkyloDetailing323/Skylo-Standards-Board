[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions."hcp-upsell-sync"]
  schedule = "*/5 * * * *"

[functions."hcp-revenue-sync"]
  schedule = "*/5 * * * *"

[functions."hcp-tip-sync"]
  schedule = "*/5 * * * *"

[functions."hcp-backfill"]
  timeout = 26

[functions."hcp-upsell-repair"]
  timeout = 26

[functions."hcp-revenue-repair"]
  timeout = 26

[functions."hcp-backfill-background"]
  # Background function — runs up to 15 min, no timeout issues

[functions."hcp-report-import"]
  # Manually triggered; pulls HCP report exports from team@skylod.com.
  timeout = 26

[functions."hcp-tech-match-check"]
  # Daily safety net: flags any HCP employee name with no exact match in the
  # techs table, so a new hire or a typo doesn't silently drop their revenue.
  schedule = "0 13 * * *"
  timeout = 26
