[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions."hcp-upsell-sync"]
  schedule = "*/5 * * * *"

[functions."hcp-revenue-sync"]
  schedule = "*/5 * * * *"

[functions."hcp-tip-sync"]
  schedule = "*/5 * * * *"

[functions."hcp-backfill"]
  timeout = 26

[functions."hcp-upsell-repair"]
  timeout = 26

[functions."hcp-revenue-repair"]
  timeout = 26

[functions."hcp-backfill-background"]
  # Background function — runs up to 15 min, no timeout issues

[functions."hcp-report-import"]
  # Manually triggered; pulls HCP report exports from team@skylod.com.
  timeout = 26

[functions."hcp-tech-match-check"]
  # Daily safety net: flags any HCP employee name with no exact match in the
  # techs table, so a new hire or a typo doesn't silently drop their revenue.
  schedule = "0 13 * * *"
  timeout = 26

[functions."ghl-sync-cron"]
  # Kicks off ghl-sync-background (GoHighLevel -> Supabase) every 15 minutes.
  schedule = "*/15 * * * *"

[functions."meta-ads-sync"]
  timeout = 26

[functions."meta-ads-sync-cron"]
  # Daily Meta ad spend pull (last 7 days). 13:20 UTC = early morning MT.
  # Does nothing until META_ADS_TOKEN and META_AD_ACCOUNT_ID are set.
  schedule = "20 13 * * *"
  timeout = 26

[functions."hcp-sales-sync-cron"]
  # Hourly HCP jobs + customer contact sync for the Sales/Marketing revenue.
  schedule = "7 * * * *"

[functions."google-ads-sync"]
  timeout = 26

[functions."google-ads-sync-cron"]
  # Google Ads + Local Services spend, last 7 days, every 4 hours.
  # Does nothing until Google Ads is connected from the Marketing tab.
  schedule = "25 */4 * * *"
  timeout = 26

[functions."ga4-sync"]
  timeout = 26

[functions."ga4-sync-cron"]
  # Website visitors from Google Analytics, last 7 days, every morning.
  # Does nothing until Google is reconnected with Analytics access.
  schedule = "35 13 * * *"

[functions."gsc-sync"]
  timeout = 26

[functions."gsc-sync-cron"]
  # Organic Google search (Search Console), last 10 days, every morning.
  # Does nothing until Google is reconnected with Search Console access.
  schedule = "45 13 * * *"

[functions."ghl-forms-sync"]
  # Pulls for up to ~20s (TIME_BUDGET_MS); the default 10s limit would cut it off.
  timeout = 26

[functions."ghl-forms-sync-cron"]
  # Tote Checks + Tech Audits (GHL forms) -> ghl_form_submissions, every 15 min.
  schedule = "*/15 * * * *"
  timeout = 26

[functions."hcp-nightly-recheck-cron"]
  # Nightly ~1:52 AM Mountain (07:52 UTC): re-reads the open pay period(s)
  # from HCP so edits made after a job first synced reach Payroll.
  schedule = "52 7 * * *"
